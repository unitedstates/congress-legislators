# SSAP20 (Senate Appropriations, Subcommittee on State, Foreign Operations, and
# Related Programs). Sen. Lindsey Graham (R-SC) chaired this subcommittee until his
# term ended 2026-07-11. Upstream's 2026-07-15 run removed him and left the
# subcommittee with no chair designation at all.
# Full-committee Chair Susan M. Collins (R-ME) has stepped in as chair per
# https://www.appropriations.senate.gov/subcommittees/state-foreign-operations-and-related-programs
# (verified 2026-08-04), where she is labeled "Chair (Interim)". Sen. Brian Schatz
# (D-HI) remains Ranking Member.
# We record her as `Chairman` rather than the site's literal "Chair (Interim)"
# because that is the string this file uses for every other SSAP subcommittee chair
# regardless of gender, and it is the value consumers rank on; an unrecognized title
# sorts to the bottom of the roster instead of the top. Her prior `Ex Officio` tag is
# replaced accordingly, since she is now actually chairing rather than sitting
# ex officio. Revisit if a permanent chair is named.
# Membership below is upstream's 2026-07-15 roster reproduced verbatim; the ONLY
