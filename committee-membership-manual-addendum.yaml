# --- House Foreign Affairs (HFAC) subcommittee changes announced 2026-08-25 ---
# Ranking Member Gregory W. Meeks announced three new Democratic members of the full
# committee and two subcommittee Ranking Member changes:
# https://democrats-foreignaffairs.house.gov/2026/8/meeks-welcomes-new-members-to-hfac
# (verified 2026-09-02). Per that release:
#   - Jared Moskowitz (M001217) becomes Ranking Member of Middle East and North
#     Africa (HSFA13), succeeding Brad Sherman, who had been Acting Ranking Member.
#   - Jonathan L. Jackson (J000309) becomes Ranking Member of Oversight and
#     Intelligence (HSFA17), succeeding Moskowitz.
#   - Debbie Wasserman Schultz (W000797) assigned to Oversight and Intelligence.
#   - Mark Pocan (P000607) assigned to Africa (HSFA16).
#   - Wesley Bell (B001324) assigned to Western Hemisphere (HSFA07).
# clerk.house.gov's MemberData.xml already reflects the three full-committee
# additions but none of the subcommittee assignments or either Ranking Member
# change, and both committee websites are still showing the pre-announcement
# rosters (democrats-foreignaffairs.house.gov still lists Sherman as "Acting
# Ranking Member" of HSFA13). Hence these overrides.
#
# ASSUMPTION: the release does not say whether Sherman and Moskowitz keep their
# seats on the subcommittees they no longer lead. Members are not normally dropped
# from a panel when its leadership rotates, so both are retained here, ranked
# immediately below the new Ranking Member per full-committee seniority. Majority
# rosters and all other minority members are upstream's verbatim. Drop these keys
# once clerk.house.gov catches up.

# HSFA13 (HFAC, Middle East and North Africa). Only minority side changes:
